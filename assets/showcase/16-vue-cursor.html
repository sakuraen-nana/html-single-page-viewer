<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFTERIMAGE · 交互海报</title>
<style>
  :root{
    --ink: #F6F2E9;
    --muted: #B8B1A4;
    --faint: #7A746A;
    --line: rgba(246,242,233,.2);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: #08070A;
    color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }
  .app{ position: relative; width: 100%; height: 100vh; min-height: 520px; overflow: hidden; }
  .shader{ position: absolute; inset: 0; width: 100%; height: 100%; }
  .veil{
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(80% 65% at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,.22) 70%, rgba(0,0,0,.62) 100%),
      linear-gradient(0deg, rgba(8,7,10,.62), rgba(8,7,10,0) 38%);
  }
  .ui{
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    padding: 24px clamp(22px, 4vw, 58px) 22px;
    pointer-events: none;
  }
  .nav{ display: flex; align-items: center; gap: 26px; }
  .brand{ font: 700 13px var(--mono); letter-spacing: .26em; }
  .nav nav{ display: flex; gap: 20px; margin-left: 14px; }
  .nav a{
    color: var(--muted); font-size: 11.5px; text-decoration: none; letter-spacing: .06em;
    pointer-events: auto;
  }
  .nav a:hover{ color: var(--ink); }
  .edition{
    margin-left: auto;
    font: 9.5px var(--mono); color: var(--faint); letter-spacing: .14em;
  }

  .poster{
    margin: auto 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 30px;
  }
  h1{
    font-size: clamp(58px, 12.5vw, 170px);
    line-height: .82;
    letter-spacing: -.055em;
    font-weight: 750;
    text-transform: uppercase;
    user-select: none;
  }
  h1 em{
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1.2px rgba(255,255,255,.72);
  }
  .caption{
    max-width: 320px;
    text-align: right;
    font-size: 12px;
    line-height: 1.85;
    color: var(--muted);
  }
  .caption b{ color: var(--ink); font-weight: 500; }
  .warn{
    margin-top: 14px;
    padding: 8px 11px;
    border-left: 2px solid #E3A04A;
    background: rgba(0,0,0,.32);
    font-size: 11px;
    line-height: 1.65;
    color: #D8C7AB;
  }

  .foot{
    display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap;
    padding-top: 15px;
    border-top: 1px solid var(--line);
    font: 9.5px var(--mono);
    letter-spacing: .12em;
    color: var(--faint);
  }
  .coords{ min-width: 150px; }
  .coords b{ color: var(--ink); font-weight: 400; }
  .palette{ display: flex; align-items: center; gap: 8px; }
  .palette i{
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
  }
  .palette span{ margin-left: 4px; color: var(--muted); letter-spacing: .1em; }
  .hint{ margin-left: auto; text-align: right; line-height: 1.8; }
  .hint b{ color: var(--ink); font-weight: 400; }
  @media (max-width: 760px){
    .nav nav{ display: none; }
    .poster{ grid-template-columns: 1fr; gap: 18px; }
    .caption{ text-align: left; max-width: 100%; }
    .hint{ display: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <div class="app" @pointermove="track" @click="cycle">
      <shader
        class="shader"
        :disable-telemetry="true"
        @unavailable="gpuError = $event"
      >
        <linear-gradient color-a="#07060B" color-b="#1A0F26" :angle="125" />
        <mesh-gradient
          :color-a="palette.meshA"
          :color-b="palette.meshB"
          :count="5"
          :smoothness="2.4"
          :variation="0.55"
          :swirl="0.5"
          :drift="0.6"
        />
        <cursor-trail
          :color-a="palette.trailA"
          :color-b="palette.trailB"
          :radius="1.1"
          :length="1.4"
          :softness="0.3"
        />
        <film-grain :strength="0.15" :animated="true" />
      </shader>
      <div class="veil"></div>

      <div class="ui">
        <header class="nav">
          <div class="brand">AFTERIMAGE</div>
          <nav>
            <a href="#">海报</a>
            <a href="#">实验</a>
            <a href="#">接触</a>
          </nav>
          <span class="edition">ISSUE 06 / 2026</span>
        </header>

        <div class="poster">
          <h1>AFTER<br /><em>IMAGE</em></h1>
          <div class="caption">
            <b>移动，留下痕迹。</b><br />
            这是一个只存在于你经过之处的画面。<br />
            点击任意位置，换一组颜色。
            <div class="warn" v-if="gpuError">当前浏览器未启用 WebGPU（{{ gpuError || 'unknown' }}），光标轨迹不可用。若通过局域网 IP 的 http:// 打开，浏览器会禁用 WebGPU；请改用 localhost / 127.0.0.1 或 HTTPS。</div>
          </div>
        </div>

        <footer class="foot">
          <div class="coords">X <b>{{ x }}</b> / Y <b>{{ y }}</b></div>
          <div class="palette">
            <i :style="{ background: palette.trailA }"></i>
            <i :style="{ background: palette.trailB }"></i>
            <i :style="{ background: palette.meshB }"></i>
            <span>{{ palette.name }}</span>
          </div>
          <div class="hint"><b>MOVE</b> TO PAINT · <b>CLICK</b> TO SHIFT</div>
        </footer>
      </div>
    </div>
  </div>

  <script src="./vendor/vue-runtime.js"></script>
  <script>
    const { Vue, Shaders } = window.HSPV_VUE;
    const { createApp, ref, computed } = Vue;
    const { Shader, LinearGradient, MeshGradient, CursorTrail, FilmGrain } = Shaders;

    createApp({
      components: { Shader, LinearGradient, MeshGradient, CursorTrail, FilmGrain },
      setup(){
        const palettes = [
          { name: 'ULTRAVIOLET', meshA: '#120A2A', meshB: '#6C5CE7', trailA: '#FF5FA2', trailB: '#00E5FF' },
          { name: 'SOLAR', meshA: '#1A0E08', meshB: '#D4552B', trailA: '#FFD166', trailB: '#FF5E7A' },
          { name: 'CHLOROPHYLL', meshA: '#07140F', meshB: '#2F8F6B', trailA: '#D8FF4F', trailB: '#6EE7FF' },
        ];
        const index = ref(0);
        const x = ref('000');
        const y = ref('000');
        const gpuError = ref('');
        const palette = computed(() => palettes[index.value]);

        function track(event){
          const rect = event.currentTarget.getBoundingClientRect();
          x.value = String(Math.round(((event.clientX - rect.left) / rect.width) * 999)).padStart(3, '0');
          y.value = String(Math.round(((event.clientY - rect.top) / rect.height) * 999)).padStart(3, '0');
        }

        function cycle(event){
          if (event.target.closest('a, button')) return;
          index.value = (index.value + 1) % palettes.length;
        }

        return { palette, index, x, y, gpuError, track, cycle };
      },
    }).mount('#app');
  </script>
</body>
</html>
