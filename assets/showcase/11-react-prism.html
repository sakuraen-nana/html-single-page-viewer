<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRISM · 让光先于语言</title>
<style>
  :root{
    --ink: #F4F2EC;
    --muted: #A5A29A;
    --dim: #6F6C65;
    --line: rgba(255,255,255,.16);
    --acid: #D8FF4F;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: #04060D;
    color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .page{ position: relative; height: 100vh; min-height: 540px; overflow: hidden; }
  .bg{
    position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 20% 0%, #0B1230 0%, #03050C 70%);
  }
  .shader{ position: absolute; inset: 0; width: 100%; height: 100%; }
  .shade{
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(3,5,12,.76) 0%, rgba(3,5,12,.34) 46%, rgba(3,5,12,.08) 72%, rgba(3,5,12,.52) 100%),
      linear-gradient(0deg, rgba(3,5,12,.72), rgba(3,5,12,0) 46%);
    pointer-events: none;
  }
  .nav{
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 28px;
    padding: 24px clamp(20px, 4vw, 56px);
  }
  .brand{ font-weight: 800; letter-spacing: .16em; font-size: 15px; }
  .brand span{ color: var(--acid); }
  .nav nav{ display: flex; gap: 22px; margin-left: 12px; }
  .nav nav a{
    color: var(--muted); font-size: 12px; text-decoration: none; letter-spacing: .08em;
    transition: color .15s;
  }
  .nav nav a:hover{ color: var(--ink); }
  .nav .enter{
    margin-left: auto;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink); font-size: 12px; text-decoration: none;
  }
  .nav .enter:hover{ border-color: var(--acid); color: var(--acid); }
  .hero{
    position: absolute; z-index: 3;
    left: clamp(20px, 6vw, 96px);
    top: 50%;
    transform: translateY(-46%);
    max-width: 640px;
  }
  .eyebrow{
    display: flex; align-items: center; gap: 12px;
    font: 10.5px ui-monospace, "SF Mono", Consolas, monospace;
    letter-spacing: .22em;
    color: var(--acid);
  }
  .eyebrow::before{ content: ""; width: 28px; height: 1px; background: var(--acid); }
  h1{
    margin: 22px 0 20px;
    font-size: clamp(44px, 7vw, 92px);
    line-height: 1.05;
    letter-spacing: -.045em;
    font-weight: 650;
  }
  h1 em{
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255,255,255,.78);
  }
  .lede{ max-width: 440px; color: var(--muted); font-size: 14.5px; line-height: 1.9; }
  .actions{ display: flex; align-items: center; gap: 14px; margin-top: 30px; flex-wrap: wrap; }
  .btn{
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit; font-size: 13px;
    cursor: pointer; text-decoration: none;
    transition: border-color .15s, color .15s, filter .15s;
  }
  .btn:hover{ border-color: rgba(255,255,255,.45); }
  .btn.primary{
    background: var(--acid);
    border-color: var(--acid);
    color: #10130A;
    font-weight: 600;
  }
  .btn.primary:hover{ filter: brightness(1.06); }
  .preset{ font: 11px ui-monospace, monospace; color: var(--dim); letter-spacing: .08em; }
  .side-note{
    position: absolute; right: clamp(20px, 4vw, 56px); top: 50%; z-index: 3;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 18px; text-align: right;
  }
  .side-note .label{
    font: 9.5px ui-monospace, monospace;
    letter-spacing: .24em;
    color: var(--muted);
    line-height: 1.8;
  }
  .side-note .big{
    font: 600 64px/1 ui-monospace, monospace;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,.4);
  }
  .stats{
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; gap: 40px; flex-wrap: wrap;
    padding: 20px clamp(20px, 4vw, 56px) 24px;
    border-top: 1px solid rgba(255,255,255,.1);
    font: 10.5px ui-monospace, monospace;
    color: var(--muted);
    letter-spacing: .1em;
  }
  .stats b{ display: block; color: var(--ink); font-size: 17px; letter-spacing: 0; margin-bottom: 4px; }
  .gpu-warning{
    margin-top: 24px;
    max-width: 430px;
    padding: 8px 12px;
    border-left: 2px solid #E3A04A;
    background: rgba(0,0,0,.3);
    font-size: 11.5px;
    line-height: 1.7;
    color: #D8C7AB;
  }
  @media (max-width: 860px){
    .nav nav{ display: none; }
    .side-note{ display: none; }
    .stats{ gap: 24px; }
    .hero{ max-width: 80vw; }
  }
  @media (max-width: 560px){
    .nav .enter{ display: none; }
    .stats{ font-size: 9px; }
    .stats b{ font-size: 14px; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react-runtime.js"></script>
  <script>
    const { React, createRoot, htm, Shaders } = window.HSPV_REACT;
    const { Shader, LinearGradient, Prism, FilmGrain } = Shaders;
    const html = htm.bind(React.createElement);

    const PRESETS = [
      { pos: { x: 0.18, y: 0.12 }, split: { x: 0.54, y: 0.46 }, spread: 0.85, intensity: 1.8 },
      { pos: { x: 0.74, y: 0.18 }, split: { x: 0.38, y: 0.52 }, spread: 1.15, intensity: 2.2 },
      { pos: { x: 0.50, y: -0.05 }, split: { x: 0.50, y: 0.50 }, spread: 1.50, intensity: 1.5 },
    ];

    function App(){
      const [preset, setPreset] = React.useState(0);
      const [gpuError, setGpuError] = React.useState('');
      const p = PRESETS[preset];

      return html`<div class="page">
        <div class="bg">
          <${Shader}
            className="shader"
            disableTelemetry=${true}
            onUnavailable=${setGpuError}
          >
            <${LinearGradient} colorA="#03050C" colorB="#101A3A" angle=${120} />
            <${Prism}
              position=${p.pos}
              splitPosition=${p.split}
              spread=${p.spread}
              intensity=${p.intensity}
              softness=${0.14}
            />
            <${FilmGrain} strength=${0.2} animated=${true} />
          <//>
        </div>
        <div class="shade"></div>

        <header class="nav">
          <div class="brand">PRISM<span>.</span></div>
          <nav>
            <a href="#">光学实验</a>
            <a href="#">档案</a>
            <a href="#">关于</a>
          </nav>
          <a class="enter" href="#">进入工坊</a>
        </header>

        <main class="hero">
          <div class="eyebrow">OPTICAL EXPERIMENTS / 01</div>
          <h1>让光，<br />先于<em>语言</em>。</h1>
          <p class="lede">一束白光穿过棱镜，被拆成它本来拥有的全部颜色。我们相信，最好的界面也应该这样——不解释，只是让人看见。</p>
          <div class="actions">
            <button class="btn primary" type="button" onClick=${() => setPreset((preset + 1) % PRESETS.length)}>
              调校光束 <span aria-hidden="true">↗</span>
            </button>
            <a class="btn" href="#hero-note">查看光学档案</a>
            <span class="preset">PRESET 0${preset + 1} / 03</span>
          </div>
          ${gpuError ? html`<div class="gpu-warning">当前浏览器未启用 WebGPU（${gpuError || 'unknown'}），背景折射效果无法显示。若通过局域网 IP 的 http:// 打开，浏览器会禁用 WebGPU；请改用 localhost / 127.0.0.1 或 HTTPS。</div>` : null}
        </main>

        <aside class="side-note" id="hero-note">
          <div class="label">SPECTRUM / 400–700 NM</div>
          <div class="big">04</div>
          <div class="label">A STUDY OF LIGHT<br />AND ITS DISCONTENTS</div>
        </aside>

        <footer class="stats">
          <div><b>01</b>RENDER LAYER</div>
          <div><b>60 fps</b>TARGET</div>
          <div><b>WebGPU</b>BACKEND</div>
          <div><b>2026</b>EDITION</div>
        </footer>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
