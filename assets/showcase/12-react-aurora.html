<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Console · 极光控制台</title>
<style>
  :root{
    --bg: #070A10;
    --panel: #0C111A;
    --panel-2: #111827;
    --line: #1D2939;
    --text: #E9EEF6;
    --muted: #8593A6;
    --faint: #5A687A;
    --mint: #62F5C9;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .shell{ display: grid; grid-template-columns: minmax(0,1fr) 372px; height: 100vh; min-height: 560px; }
  .preview{
    position: relative;
    min-width: 0;
    overflow: hidden;
    background: radial-gradient(120% 100% at 30% 0%, #0A1730 0%, #03060D 72%);
  }
  .shader{ position: absolute; inset: 0; width: 100%; height: 100%; }
  .preview::after{
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(3,6,13,.65), rgba(3,6,13,0) 35%);
    pointer-events: none;
  }
  .preview__head{
    position: absolute; top: 22px; left: 24px; right: 24px;
    display: flex; align-items: center; gap: 12px; z-index: 2;
  }
  .preview__brand{ font: 700 12px var(--mono); letter-spacing: .18em; }
  .live{
    display: inline-flex; align-items: center; gap: 6px;
    font: 9.5px var(--mono); letter-spacing: .14em;
    color: var(--mint);
    border: 1px solid rgba(98,245,201,.35);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .live i{
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--mint);
    animation: blink 1.8s infinite;
  }
  @keyframes blink{ 50%{ opacity: .25; } }
  .preview__tag{
    margin-left: auto;
    font: 10px var(--mono);
    color: var(--faint);
    letter-spacing: .08em;
  }
  .preview__hero{
    position: absolute; left: 24px; bottom: 34px; z-index: 2;
    max-width: 560px;
  }
  .preview__hero h1{
    font-size: clamp(30px, 4.2vw, 54px);
    line-height: 1.12;
    letter-spacing: -.03em;
    font-weight: 650;
  }
  .preview__hero p{
    margin-top: 12px;
    max-width: 400px;
    color: #B5C0CE;
    font-size: 13px;
    line-height: 1.8;
  }
  .preview__hint{
    margin-top: 18px;
    font: 10px var(--mono);
    color: var(--faint);
    letter-spacing: .08em;
  }
  .gpu-warning{
    position: absolute; left: 24px; top: 68px; z-index: 3;
    max-width: 440px;
    padding: 8px 12px;
    border-left: 2px solid #E3A04A;
    background: rgba(0,0,0,.32);
    font-size: 11.5px;
    line-height: 1.7;
    color: #D8C7AB;
  }

  .panel{
    display: flex; flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
  }
  .panel__head{
    display: flex; align-items: baseline; gap: 10px;
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    font-weight: 600;
  }
  .panel__head span{ margin-left: auto; font: 10px var(--mono); color: var(--faint); }
  .panel__body{ padding: 18px 22px 24px; }
  .section{ margin-bottom: 22px; }
  .section__label{
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
    font: 10px var(--mono);
    letter-spacing: .14em;
    color: var(--faint);
    text-transform: uppercase;
  }
  .section__label b{ color: var(--mint); font-weight: 500; letter-spacing: 0; }
  .presets{ display: flex; gap: 6px; flex-wrap: wrap; }
  .preset{
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: .15s;
  }
  .preset:hover{ border-color: #344358; color: var(--text); }
  .preset.on{ border-color: var(--mint); color: var(--mint); background: rgba(98,245,201,.07); }
  .colors{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .color{
    display: flex; flex-direction: column; gap: 6px;
    font-size: 10px; color: var(--faint);
  }
  .color input{
    width: 100%;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    padding: 3px;
    cursor: pointer;
  }
  .control{ display: block; margin-bottom: 16px; }
  .control .row{
    display: flex; justify-content: space-between; gap: 12px;
    margin-bottom: 7px;
    font-size: 12px;
    color: #C6D0DD;
  }
  .control .row b{ font: 11px var(--mono); color: var(--mint); font-weight: 500; }
  input[type="range"]{
    width: 100%;
    height: 4px;
    appearance: none;
    background: #1E2A3B;
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb{
    appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--mint);
    border: 2px solid #0C111A;
    cursor: pointer;
  }
  .toggle{
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: #C6D0DD;
    cursor: pointer;
    user-select: none;
  }
  .toggle input{ width: 15px; height: 15px; accent-color: var(--mint); }
  .code{
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #080D14;
    padding: 12px 14px;
    font: 10.5px/1.8 var(--mono);
    color: #93A4B8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .code b{ color: var(--mint); font-weight: 500; }
  .panel__foot{
    margin-top: auto;
    padding: 14px 22px 20px;
    border-top: 1px solid var(--line);
    font-size: 10.5px;
    line-height: 1.7;
    color: var(--faint);
  }
  @media (max-width: 820px){
    body{ overflow: auto; }
    .shell{ display: block; height: auto; }
    .preview{ height: 58vh; min-height: 380px; }
    .panel{ border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react-runtime.js"></script>
  <script>
    const { React, createRoot, htm, Shaders } = window.HSPV_REACT;
    const { Shader, LinearGradient, Aurora, FilmGrain } = Shaders;
    const html = htm.bind(React.createElement);

    const PRESETS = [
      { name: "北极光", colors: ["#A533F8", "#22EE88", "#1694E8"], intensity: 82, speed: 5, waviness: 62 },
      { name: "玫瑰云", colors: ["#FF5E7A", "#FFD166", "#6C5CE7"], intensity: 68, speed: 3, waviness: 78 },
      { name: "电离层", colors: ["#00E5FF", "#7CFFB2", "#FF5E7A"], intensity: 92, speed: 8, waviness: 46 },
    ];

    function App(){
      const [presetIndex, setPresetIndex] = React.useState(0);
      const [colors, setColors] = React.useState(PRESETS[0].colors);
      const [intensity, setIntensity] = React.useState(PRESETS[0].intensity);
      const [speed, setSpeed] = React.useState(PRESETS[0].speed);
      const [waviness, setWaviness] = React.useState(PRESETS[0].waviness);
      const [grain, setGrain] = React.useState(true);
      const [gpuError, setGpuError] = React.useState('');

      function applyPreset(index){
        const preset = PRESETS[index];
        setPresetIndex(index);
        setColors([...preset.colors]);
        setIntensity(preset.intensity);
        setSpeed(preset.speed);
        setWaviness(preset.waviness);
      }

      function updateColor(index, value){
        setColors((prev) => prev.map((color, i) => i === index ? value : color));
        setPresetIndex(-1);
      }

      const code = `Aurora\n  colorA="${colors[0]}"\n  colorB="${colors[1]}"\n  colorC="${colors[2]}"\n  intensity={${intensity}}\n  speed={${speed}}\n  waviness={${waviness}}`;

      return html`<div class="shell">
        <section class="preview">
          <${Shader}
            className="shader"
            disableTelemetry=${true}
            onUnavailable=${setGpuError}
          >
            <${LinearGradient} colorA="#02040C" colorB="#0C1A34" angle=${105} />
            <${Aurora}
              colorA=${colors[0]}
              colorB=${colors[1]}
              colorC=${colors[2]}
              intensity=${intensity}
              speed=${speed}
              waviness=${waviness}
              curtainCount=${4}
            />
            ${grain ? html`<${FilmGrain} strength=${0.2} animated=${true} />` : null}
          <//>

          <div class="preview__head">
            <span class="preview__brand">AURORA / CONSOLE</span>
            <span class="live"><i></i> LIVE</span>
            <span class="preview__tag">React 19 × shaders</span>
          </div>

          ${gpuError ? html`<div class="gpu-warning">当前浏览器未启用 WebGPU（${gpuError || 'unknown'}），极光实时渲染不可用。若通过局域网 IP 的 http:// 打开，浏览器会禁用 WebGPU；请改用 localhost / 127.0.0.1 或 HTTPS。</div>` : null}

          <div class="preview__hero">
            <h1>把极光<br />留在屏幕里。</h1>
            <p>每一层颜色都由 GPU 实时计算。拖动右侧参数，观察光幕如何改变形状与温度。</p>
            <div class="preview__hint">REACTIVE PROPS · 60 FPS TARGET · WEBGPU</div>
          </div>
        </section>

        <aside class="panel">
          <div class="panel__head">控制台 <span>REAL-TIME</span></div>
          <div class="panel__body">
            <div class="section">
              <div class="section__label"><span>预设</span><span>PRESET</span></div>
              <div class="presets">
                ${PRESETS.map((preset, index) => html`
                  <button
                    type="button"
                    class=${'preset' + (presetIndex === index ? ' on' : '')}
                    onClick=${() => applyPreset(index)}
                  >${preset.name}</button>
                `)}
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>颜色</span><span>COLOR</span></div>
              <div class="colors">
                ${["边缘", "核心", "光梢"].map((label, index) => html`
                  <label class="color">
                    <span>${label}</span>
                    <input type="color" value=${colors[index]} onChange=${(event) => updateColor(index, event.target.value)} />
                  </label>
                `)}
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>参数</span><span>PROPS</span></div>
              <label class="control">
                <span class="row"><span>亮度 intensity</span><b>${intensity}</b></span>
                <input type="range" min="10" max="100" step="1" value=${intensity} onInput=${(event) => setIntensity(Number(event.target.value))} />
              </label>
              <label class="control">
                <span class="row"><span>速度 speed</span><b>${speed}</b></span>
                <input type="range" min="-10" max="10" step="1" value=${speed} onInput=${(event) => setSpeed(Number(event.target.value))} />
              </label>
              <label class="control">
                <span class="row"><span>波动 waviness</span><b>${waviness}</b></span>
                <input type="range" min="0" max="100" step="1" value=${waviness} onInput=${(event) => setWaviness(Number(event.target.value))} />
              </label>
              <label class="toggle">
                <input type="checkbox" checked=${grain} onChange=${(event) => setGrain(event.target.checked)} />
                胶片颗粒
              </label>
            </div>

            <div class="code">${code}</div>
          </div>
          <div class="panel__foot">
            所有控件通过 React state 直接写入 shader uniform，无需重新加载页面。<br />
            WebGPU 不可用时，页面会显示降级提示。
          </div>
        </aside>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
