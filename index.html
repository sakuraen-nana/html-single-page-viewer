<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<title>单页预览</title>
<style>
  :root{
    color-scheme: light;
    --bg: #F3F0E9;
    --panel: #FBFAF6;
    --panel-2: #F0ECE3;
    --line: #D8D2C4;
    --line-soft: #E7E2D7;
    --text: #2B2822;
    --muted: #6F6A5F;
    --faint: #7C7669;
    --gold: #8F6A2C;
    --gold-line: #C08A4E;
    --danger: #B0453A;
    --well: #EDE9E0;
    --tab-h: 56px;
    --sidebar-w: 300px;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  *{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden]{ display: none !important; }
  html, body{ height: 100%; }
  body{
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 左侧垂直标签栏 ───────────────────────────── */
  .sidebar{
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .sidebar__head{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .sidebar__brand{
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .sidebar__title{
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--gold);
  }
  .sidebar__sub{
    font-size: 11.5px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-btn{
    margin-left: auto;
    display: grid; place-items: center;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s, transform .3s;
  }
  .icon-btn:hover{ color: var(--text); border-color: var(--gold-line); }
  .icon-btn.spinning{ transform: rotate(360deg); }
  .icon-btn svg{ width: 15px; height: 15px; }
  .drawer__close{ display: none; }

  .tabs{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .tabs::-webkit-scrollbar{ width: 8px; }
  .tabs::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  .tab{
    position: relative;
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) 16px;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: var(--tab-h);
    padding: 8px 10px 8px 12px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
    font: inherit;
    transition: background .12s, color .12s, border-color .12s;
  }
  .tab:hover{ background: var(--panel-2); color: var(--text); }
  .tab.is-active{
    background: #FFFFFF;
    border-color: var(--line);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(43, 40, 34, .06);
  }
  .tab.is-active::before{
    content: "";
    position: absolute;
    left: -1px; top: 10px; bottom: 10px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--gold);
  }
  .tab.is-error{ color: var(--danger); }
  .tab.is-error .tab__index{ border-color: rgba(199,122,106,.45); color: var(--danger); }
  .tab__index{
    display: grid; place-items: center;
    width: 26px; height: 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #FFFFFF;
    font-size: 11px;
    letter-spacing: .5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .tab.is-active .tab__index{ border-color: var(--gold-line); color: var(--gold); }
  .tab__body{ min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tab__title{
    font-size: 13px;
    line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab__path{
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left;
  }
  .tab__state{
    justify-self: end;
    font-size: 10px;
    color: var(--danger);
    white-space: nowrap;
  }

  .sidebar__foot{
    padding: 10px 16px 12px;
    border-top: 1px solid var(--line-soft);
    font-size: 11px;
    color: var(--faint);
    line-height: 1.6;
  }
  .sidebar__foot code{
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 10.5px;
  }

  /* ── 右侧预览区 ───────────────────────────────── */
  .stage{
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
  }
  .stage__bar{
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .stage__indicator{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    flex: none;
  }
  .stage__indicator.is-ok{ background: var(--gold); }
  .stage__indicator.is-error{ background: var(--danger); }
  .stage__label{
    min-width: 0;
    display: flex; align-items: baseline; gap: 12px;
  }
  .stage__name{
    font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stage__src{
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl;
  }
  .stage__brand{
    display: none;
    flex-direction: column;
    gap: 2px;
    flex: none;
    min-width: 0;
    max-width: 42vw;
    padding-right: 10px;
    border-right: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .stage__brand-title{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--gold);
    white-space: nowrap;
  }
  .stage__brand-sub{
    max-width: 100%;
    font-size: 10.5px;
    color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stage__actions{ margin-left: auto; display: flex; gap: 8px; flex: none; }
  .action{
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .action:hover{ color: var(--text); border-color: var(--gold-line); }
  .action svg{ width: 13px; height: 13px; }
  .action[aria-disabled="true"]{ opacity: .45; pointer-events: none; }

  .stage__frame{
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--well);
  }
  .frame-canvas{
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
  }
  .frame-scaler{
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: top left;
    will-change: transform;
  }
  .frame-scaler.is-custom{
    left: 50%;
    top: 50%;
    transform-origin: center center;
  }
  .frame-scaler iframe{
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    /* 白色画布：无样式页面的默认黑字可见；页面自带背景会覆盖它 */
    background: #fff;
  }
  .frame-mask{
    position: absolute; inset: 0;
    z-index: 3;
    display: none;
    place-items: center;
    background: var(--well);
    color: var(--muted);
  }
  .frame-mask.is-visible{ display: grid; }

  .drawer__scrim{
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(43, 40, 34, .34);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .26s ease, visibility 0s linear .26s;
  }
  .drawer__scrim.is-open{
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .26s ease;
  }

  .spinner{
    width: 26px; height: 26px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .placeholder{
    height: 100%;
    display: grid;
    place-items: center;
    padding: 40px;
    text-align: center;
  }
  .placeholder__inner{ max-width: 520px; }
  .placeholder h2{
    font-size: 16px; font-weight: 600; letter-spacing: .5px;
    margin-bottom: 10px;
  }
  .placeholder p{
    font-size: 13px; color: var(--muted); line-height: 1.8;
  }
  .placeholder code{
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--gold);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2px 6px;
  }
  .placeholder .err{ color: var(--danger); }

  .stage__error{
    display: none;
    height: 100%;
    place-items: center;
    padding: 40px;
    text-align: center;
  }
  .stage__error.is-visible{ display: grid; }
  .stage__error h2{ font-size: 15px; margin-bottom: 8px; color: var(--danger); }
  .stage__error p{ font-size: 13px; color: var(--muted); line-height: 1.8; max-width: 560px; }
  .stage__frame > .placeholder,
  .stage__frame > .stage__error{
    position: absolute;
    inset: 0;
    height: auto;
    z-index: 2;
  }

  /* ── 底部状态与控制条 ─────────────────────────── */
  .stage__hud{
    flex: none;
    display: flex;
    align-items: center;
    gap: 20px;
    min-height: 46px;
    padding: 0 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  .hud__status{
    display: flex;
    align-items: center;
    gap: 20px;
    min-width: 0;
  }
  .hud__metric{
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
    white-space: nowrap;
  }
  .hud__key{
    font-size: 10px;
    letter-spacing: .4px;
    color: var(--faint);
  }
  .hud__value{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hud__zoom{
    display: flex;
    align-items: center;
    gap: 8px;
    width: min(370px, 42vw);
    min-width: 220px;
    margin-left: auto;
  }
  .hud__btn{
    flex: none;
    display: grid;
    place-items: center;
    width: 26px; height: 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .hud__btn:hover{ color: var(--text); border-color: var(--gold-line); background: #fff; }
  .hud__btn:disabled{ opacity: .4; cursor: default; }
  .hud__btn:disabled:hover{ color: var(--muted); border-color: var(--line); background: transparent; }
  .hud__btn:focus-visible,
  .hud__range:focus-visible{ outline: 2px solid var(--gold-line); outline-offset: 2px; }
  .hud__btn svg{ width: 13px; height: 13px; }
  .hud__menu{ display: none; }
  .hud__range{
    --fill: 42.86%;
    flex: 1;
    min-width: 72px;
    height: 22px;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .hud__range::-webkit-slider-runnable-track{
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right, var(--gold) 0 var(--fill), var(--line) var(--fill) 100%);
  }
  .hud__range::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    margin-top: -6px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(43, 40, 34, .18);
  }
  .hud__range::-moz-range-track{
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }
  .hud__range::-moz-range-progress{
    height: 4px;
    border-radius: 999px;
    background: var(--gold);
  }
  .hud__range::-moz-range-thumb{
    width: 14px; height: 14px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(43, 40, 34, .18);
  }
  .hud__zoom-readout{
    display: flex;
    align-items: baseline;
    gap: 5px;
    white-space: nowrap;
  }
  .hud__zoom-key{ font-size: 10px; color: var(--faint); }
  .hud__zoom-value{
    min-width: 42px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── iframe 尺寸限制条 ───────────────────────── */
  .stage__sizer{
    flex: none;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 6px 14px;
    border-top: 1px solid var(--line);
    background: var(--panel);
    font-size: 12px;
    color: var(--muted);
  }
  .sizer__title{
    font-size: 10px;
    letter-spacing: .4px;
    color: var(--faint);
  }
  .sizer__field{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sizer__label{ font-size: 10px; color: var(--faint); }
  .sizer__select,
  .sizer__input,
  .sizer__reset{
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-size: 12px;
  }
  .sizer__select{ padding: 0 6px; cursor: pointer; }
  .sizer__select:disabled{ opacity: .55; background: var(--panel-2); cursor: default; }
  .sizer__orient{
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .sizer__orient:hover{ color: var(--text); border-color: var(--gold-line); }
  .sizer__orient[data-orientation="portrait"]{
    color: var(--gold);
    border-color: var(--gold-line);
    background: var(--panel-2);
  }
  .sizer__orient:focus-visible{ outline: 2px solid var(--gold-line); outline-offset: 2px; }
  .sizer__input{
    width: 72px;
    padding: 0 6px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .sizer__input::placeholder{ color: var(--faint); font-family: inherit; }
  .sizer__unit{ font-size: 9px; color: var(--faint); }
  .sizer__readout{
    margin-left: auto;
    min-width: 0;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--gold);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sizer__reset{
    padding: 0 10px;
    cursor: pointer;
    color: var(--muted);
    transition: color .15s, border-color .15s;
  }
  .sizer__reset:hover{ color: var(--text); border-color: var(--gold-line); }
  .sizer__select:focus-visible,
  .sizer__input:focus-visible,
  .sizer__reset:focus-visible{ outline: 2px solid var(--gold-line); outline-offset: 2px; }

  @media (min-width: 1500px){
    :root{ --sidebar-w: 336px; }
  }
  @media (max-width: 1180px){
    .stage__hud{ flex-wrap: wrap; gap: 6px 16px; padding: 8px 14px; }
    .hud__status{ flex: 1 1 100%; gap: 16px; }
    .hud__zoom{ width: 100%; margin-left: 0; }
  }
  @media (max-width: 980px){
    :root{ --sidebar-w: 248px; }
    .stage__src{ display: none; }
  }
  @media (max-width: 760px){
    body{
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
    }
    /* 侧栏改为覆盖约 70% 宽度的左侧条目抽屉 */
    .sidebar{
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 40;
      width: 70vw;
      max-height: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      border-right: 1px solid var(--line);
      border-bottom: 0;
      box-shadow: 0 12px 40px rgba(43, 40, 34, .22);
      transform: translateX(-102%);
      visibility: hidden;
      pointer-events: none;
      transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;
      will-change: transform;
    }
    .sidebar.is-open{
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .sidebar__head{ padding: 10px 12px 8px; gap: 6px; }
    .sidebar__foot{ display: none; }
    .drawer__close{ display: grid; margin-left: 0; flex: none; }
    .tabs{
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 8px;
      gap: 4px;
      scroll-snap-type: none;
      overscroll-behavior: contain;
    }
    .tab{
      min-width: 0;
      min-height: 54px;
      height: auto;
      padding: 8px 8px 8px 10px;
      grid-template-columns: 26px minmax(0, 1fr) 14px;
      gap: 8px;
      scroll-snap-align: none;
    }
    .tab__index{ width: 24px; height: 24px; }
    .tab__title{ font-size: 12.5px; }
    .tab__path{ font-size: 10px; }
    .tab.is-active::before{
      left: -1px; right: auto; top: 9px; bottom: 9px;
      width: 3px; height: auto; border-radius: 0 3px 3px 0;
    }

    /* 顶部单行：品牌与统计、当前页标题、操作按钮 */
    .stage__bar{
      height: calc(52px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 10px 0;
      gap: 8px;
    }
    .stage__brand{ display: flex; }
    .stage__indicator{ display: none; }
    .stage__label{ flex: 1; gap: 0; }
    .stage__src{ display: none; }
    .stage__name{ font-size: 12.5px; }
    .stage__actions{ gap: 6px; }
    .action{ height: 30px; padding: 0 9px; font-size: 11.5px; }

    .stage__hud{
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "menu status"
        "zoom zoom";
      gap: 8px;
      min-height: 0;
      padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    }
    /* 菜单按钮位于“真实分辨率”左侧、减号按钮上方 */
    .hud__menu{
      display: grid;
      grid-area: menu;
      align-self: center;
      justify-self: start;
    }
    .hud__menu svg{ width: 16px; height: 16px; }
    .hud__status{
      display: grid;
      grid-area: status;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
    }
    .hud__metric{
      display: grid;
      gap: 2px;
      padding: 6px 8px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel-2);
      min-width: 0;
    }
    .hud__key{ font-size: 9px; letter-spacing: .3px; }
    .hud__value{
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud__zoom{ grid-area: zoom; width: 100%; margin-left: 0; gap: 6px; }
    .hud__btn{ width: 36px; height: 36px; border-radius: 8px; font-size: 17px; }
    .hud__range{ height: 36px; }
    .hud__range::-webkit-slider-thumb{ width: 20px; height: 20px; margin-top: -8px; }
    .hud__range::-moz-range-thumb{ width: 18px; height: 18px; }
    .hud__zoom-key{ display: none; }
    .hud__zoom-value{ font-size: 12px; }

    .stage__sizer{
      padding: 8px 10px;
      gap: 6px 8px;
    }
    .sizer__title{ display: none; }
    .sizer__field{ gap: 4px; }
    .sizer__label{ font-size: 9px; }
    .sizer__select,
    .sizer__input,
    .sizer__reset,
    .sizer__orient{ height: 32px; font-size: 11px; }
    .sizer__select{ padding: 0 4px; }
    .sizer__orient{ padding: 0 6px; }
    .sizer__input{ width: 52px; padding: 0 4px; }
    .sizer__unit{ display: none; }
    .sizer__reset{ padding: 0 8px; }
    .sizer__readout{
      flex: 1 1 auto;
      margin-left: 0;
      font-size: 10.5px;
    }
    .sizer__field--ratio{ order: 1; }
    .sizer__field--short{ order: 2; }
    .sizer__field--long{ order: 3; }
    .sizer__field--width{ order: 4; }
    .sizer__field--height{ order: 5; }
    .sizer__readout{ order: 6; }
    .sizer__reset{ order: 7; }

    .placeholder{ padding: 24px; }
  }
  @media (max-width: 420px){
    .action__label{ display: none; }
    .action{ width: 32px; padding: 0; justify-content: center; }
    .stage__brand{ max-width: 42vw; padding-right: 8px; }
    .stage__brand-title{ font-size: 12px; letter-spacing: 1px; }
    .stage__brand-sub{ font-size: 9.5px; }
    .stage__name{ max-width: none; }
    .hud__value{ font-size: 10.5px; }
    .hud__zoom-value{ min-width: 36px; font-size: 11.5px; }
  }
  @media (max-height: 620px) and (orientation: landscape) and (min-width: 761px){
    .sidebar__foot{ display: none; }
    .sidebar__head{ padding: 10px 16px 8px; }
    .tabs{ padding: 6px 8px; gap: 2px; }
    .tab{ min-height: 46px; }
    .stage__bar{ height: 40px; }
    .stage__sizer{ padding-top: 4px; padding-bottom: 4px; }
    .stage__hud{ min-height: 38px; padding-top: 4px; padding-bottom: 4px; }
  }
</style>
</head>
<body>
  <aside class="sidebar" id="entry-drawer" aria-label="条目浏览">
    <div class="sidebar__head">
      <div class="sidebar__brand">
        <span class="sidebar__title">单页预览</span>
        <span class="sidebar__sub" id="count">正在读取列表…</span>
      </div>
      <button class="icon-btn" id="reload" type="button" title="重新读取 config.json" aria-label="重新读取列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn drawer__close" id="drawer-close" type="button" title="关闭条目浏览" aria-label="关闭条目浏览">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <nav class="tabs" id="tabs" aria-label="页面列表"></nav>
    <div class="sidebar__foot">
      列表来源：<code>config.json</code><br>
      路径相对于仓库根目录
    </div>
  </aside>

  <main class="stage">
    <div class="stage__bar">
      <div class="stage__brand">
        <span class="stage__brand-title">单页预览</span>
        <span class="stage__brand-sub" id="count-top">正在读取列表…</span>
      </div>
      <span class="stage__indicator" id="indicator"></span>
      <div class="stage__label">
        <span class="stage__name" id="current-name">尚未选择</span>
        <span class="stage__src" id="current-src"></span>
      </div>
      <div class="stage__actions">
        <button class="action" id="refresh-frame" type="button" aria-disabled="true" title="重新载入当前页面" aria-label="重新载入当前页面">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          <span class="action__label">重载</span>
        </button>
        <a class="action" id="open-raw" href="#" target="_blank" rel="noopener" aria-disabled="true" title="在新标签页打开" aria-label="在新标签页打开">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M21 3 10 14"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          <span class="action__label">新标签页</span>
        </a>
      </div>
    </div>

    <div class="stage__frame" id="frame-viewport">
      <div class="placeholder" id="placeholder">
        <div class="placeholder__inner">
          <h2 id="placeholder-title">选择一个页面</h2>
          <p id="placeholder-text">从左侧列表中选择条目，右侧将载入对应的 HTML 单页。</p>
        </div>
      </div>
      <div class="stage__error" id="stage-error">
        <div>
          <h2>无法显示该页面</h2>
          <p id="stage-error-text"></p>
        </div>
      </div>
      <div class="frame-canvas">
        <div class="frame-scaler" id="frame-scaler">
          <iframe id="frame" title="页面预览" hidden></iframe>
        </div>
      </div>
      <div class="frame-mask" id="frame-mask"><div><div class="spinner"></div>载入中…</div></div>
    </div>

    <section class="stage__sizer" aria-label="iframe 尺寸限制">
      <span class="sizer__title">尺寸</span>
      <div class="sizer__field sizer__field--ratio">
        <label class="sizer__label" for="size-ratio">比例</label>
        <select class="sizer__select" id="size-ratio">
          <option value="auto">自适应</option>
          <option value="1:1">1:1</option>
          <option value="4:3">4:3</option>
          <option value="16:9">16:9</option>
          <option value="16:10">16:10</option>
          <option value="21:9">21:9</option>
          <option value="actual" disabled>按宽高</option>
        </select>
        <button class="sizer__orient" id="size-orient" type="button" title="当前横向，点击切换为纵向" aria-label="比例方向：横向，点击切换为纵向">横向</button>
      </div>
      <label class="sizer__field sizer__field--short">
        <span class="sizer__label">短边</span>
        <select class="sizer__select" id="size-short">
          <option value="auto">自适应</option>
        </select>
      </label>
      <label class="sizer__field sizer__field--long">
        <span class="sizer__label">长边</span>
        <select class="sizer__select" id="size-long">
          <option value="auto">自适应</option>
        </select>
      </label>
      <label class="sizer__field sizer__field--width">
        <span class="sizer__label">宽</span>
        <input class="sizer__input" id="size-width" type="number" inputmode="numeric" min="1" placeholder="自适应">
        <span class="sizer__unit">px</span>
      </label>
      <label class="sizer__field sizer__field--height">
        <span class="sizer__label">高</span>
        <input class="sizer__input" id="size-height" type="number" inputmode="numeric" min="1" placeholder="自适应">
        <span class="sizer__unit">px</span>
      </label>
      <span class="sizer__readout" id="size-readout" aria-live="polite">自适应</span>
      <button class="sizer__reset" id="size-reset" type="button" title="清除尺寸限制" aria-label="清除尺寸限制">重置</button>
    </section>

    <section class="stage__hud" aria-label="预览状态与缩放控制">
      <button class="hud__btn hud__menu" id="menu-toggle" type="button" title="浏览条目" aria-label="浏览条目" aria-controls="entry-drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      </button>
      <div class="hud__status">
        <div class="hud__metric" title="预览区域换算为设备像素：CSS 视口 × 缩放 × DPR（不随 iframe 尺寸限制变化）">
          <span class="hud__key">真实分辨率</span>
          <span class="hud__value" id="metric-device">—</span>
        </div>
        <div class="hud__metric" title="预览区域的 CSS 布局视口，受缩放影响（不随 iframe 尺寸限制变化）">
          <span class="hud__key">CSS 视口</span>
          <span class="hud__value" id="metric-css">—</span>
        </div>
        <div class="hud__metric" title="iframe 所在窗口的设备像素比">
          <span class="hud__key">DPR</span>
          <span class="hud__value" id="metric-dpr">—</span>
        </div>
      </div>
      <div class="hud__zoom">
        <button class="hud__btn" id="zoom-out" type="button" title="缩小 10%" aria-label="缩小 iframe">−</button>
        <input class="hud__range" id="zoom-range" type="range" min="25" max="200" step="5" value="100" aria-label="iframe 缩放倍率">
        <button class="hud__btn" id="zoom-in" type="button" title="放大 10%" aria-label="放大 iframe">+</button>
        <span class="hud__zoom-readout">
          <span class="hud__zoom-key">缩放</span>
          <output class="hud__zoom-value" id="zoom-value" for="zoom-range">100%</output>
        </span>
        <button class="hud__btn" id="zoom-reset" type="button" title="重置为 100%" aria-label="重置缩放">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </section>
  </main>

  <div class="drawer__scrim" id="drawer-scrim" aria-hidden="true"></div>

<script>
(() => {
  const els = {
    tabs: document.getElementById('tabs'),
    count: document.getElementById('count'),
    countTop: document.getElementById('count-top'),
    sidebar: document.getElementById('entry-drawer'),
    stage: document.querySelector('.stage'),
    menuToggle: document.getElementById('menu-toggle'),
    drawerClose: document.getElementById('drawer-close'),
    drawerScrim: document.getElementById('drawer-scrim'),
    reload: document.getElementById('reload'),
    frame: document.getElementById('frame'),
    mask: document.getElementById('frame-mask'),
    placeholder: document.getElementById('placeholder'),
    placeholderTitle: document.getElementById('placeholder-title'),
    placeholderText: document.getElementById('placeholder-text'),
    stageError: document.getElementById('stage-error'),
    stageErrorText: document.getElementById('stage-error-text'),
    currentName: document.getElementById('current-name'),
    currentSrc: document.getElementById('current-src'),
    indicator: document.getElementById('indicator'),
    refreshFrame: document.getElementById('refresh-frame'),
    openRaw: document.getElementById('open-raw'),
    frameViewport: document.getElementById('frame-viewport'),
    frameScaler: document.getElementById('frame-scaler'),
    metricDevice: document.getElementById('metric-device'),
    metricCss: document.getElementById('metric-css'),
    metricDpr: document.getElementById('metric-dpr'),
    sizeRatio: document.getElementById('size-ratio'),
    sizeOrient: document.getElementById('size-orient'),
    sizeShort: document.getElementById('size-short'),
    sizeLong: document.getElementById('size-long'),
    sizeWidth: document.getElementById('size-width'),
    sizeHeight: document.getElementById('size-height'),
    sizeReadout: document.getElementById('size-readout'),
    sizeReset: document.getElementById('size-reset'),
    zoomRange: document.getElementById('zoom-range'),
    zoomValue: document.getElementById('zoom-value'),
    zoomOut: document.getElementById('zoom-out'),
    zoomIn: document.getElementById('zoom-in'),
    zoomReset: document.getElementById('zoom-reset'),
  };

  const ZOOM_MIN = 25;
  const ZOOM_MAX = 200;
  const ZOOM_STEP = 10;
  const ZOOM_STORAGE_KEY = 'html-single-page-viewer:zoom';
  const DEFAULT_TITLE = '单页预览';
  const DEFAULT_TITLE_SEPARATOR = ' · ';
  const SIZE_PRESETS = [360, 480, 720, 1080, 1920, 2160, 3840];
  const SIZE_RATIOS = {
    '1:1': [1, 1],
    '4:3': [4, 3],
    '16:9': [16, 9],
    '16:10': [16, 10],
    '21:9': [21, 9],
  };
  const RATIO_LABELS = {
    '1:1': ['1:1', '1:1'],
    '4:3': ['4:3', '3:4'],
    '16:9': ['16:9', '9:16'],
    '16:10': ['16:10', '10:16'],
    '21:9': ['21:9', '9:21'],
  };
  const COMPUTED_OPTION = '__computed__';

  const DRAWER_MEDIA = window.matchMedia('(max-width: 760px)');

  let entries = [];
  let activeIndex = null;
  let zoom = readStoredZoom();
  let titleConfig = normalizeTitleConfig();
  let drawerOpen = false;
  const sizeState = {
    ratio: 'auto',
    orientation: 'landscape',
    short: 'auto',
    long: 'auto',
    width: null,
    height: null,
  };

  function setCount(text) {
    els.count.textContent = text;
    els.countTop.textContent = text;
  }

  function isDrawerLayout() {
    return DRAWER_MEDIA.matches;
  }

  function setDrawerOpen(open, { restoreFocus = true } = {}) {
    const next = Boolean(open) && isDrawerLayout();
    const changed = next !== drawerOpen;
    drawerOpen = next;
    els.sidebar.classList.toggle('is-open', next);
    els.drawerScrim.classList.toggle('is-open', next);
    els.menuToggle.setAttribute('aria-expanded', String(next));
    els.stage.inert = next;
    if (!changed) return;

    if (next) {
      requestAnimationFrame(() => {
        const target = els.tabs.querySelector('.tab.is-active') || els.tabs.querySelector('.tab');
        if (!target) return;
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: 'center' });
      });
    } else if (restoreFocus) {
      els.menuToggle.focus({ preventScroll: true });
    }
  }

  function setBarState(state) {
    els.indicator.className = 'stage__indicator' +
      (state === 'ok' ? ' is-ok' : state === 'error' ? ' is-error' : '');
  }

  function normalizeTitleConfig(raw) {
    if (typeof raw === 'string') {
      const value = raw.trim();
      return { mode: 'fixed', value: value || DEFAULT_TITLE, separator: DEFAULT_TITLE_SEPARATOR };
    }
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      const value = typeof raw.value === 'string' ? raw.value.trim() : '';
      if (value) {
        return {
          mode: raw.mode === 'prefix' ? 'prefix' : 'fixed',
          value,
          separator: typeof raw.separator === 'string' ? raw.separator : DEFAULT_TITLE_SEPARATOR,
        };
      }
    }
    return { mode: 'fixed', value: DEFAULT_TITLE, separator: DEFAULT_TITLE_SEPARATOR };
  }

  function applyDocumentTitle(itemTitle = '') {
    const current = typeof itemTitle === 'string' ? itemTitle.trim() : '';
    if (titleConfig.mode === 'prefix' && current) {
      document.title = `${titleConfig.value}${titleConfig.separator}${current}`;
      return;
    }
    document.title = titleConfig.value;
  }

  function clampZoom(value) {
    return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, value));
  }

  function readStoredZoom() {
    try {
      const stored = Number(localStorage.getItem(ZOOM_STORAGE_KEY));
      if (Number.isFinite(stored) && stored >= ZOOM_MIN && stored <= ZOOM_MAX) return stored;
    } catch {}
    return 100;
  }

  function zoomPercent() {
    return Math.round(zoom);
  }

  function updateZoomReadout() {
    const percent = zoomPercent();
    els.zoomRange.value = String(percent);
    els.zoomValue.textContent = `${percent}%`;
    const fill = ((percent - ZOOM_MIN) / (ZOOM_MAX - ZOOM_MIN)) * 100;
    els.zoomRange.style.setProperty('--fill', `${fill}%`);
    els.zoomOut.disabled = zoom <= ZOOM_MIN;
    els.zoomIn.disabled = zoom >= ZOOM_MAX;
  }

  function viewportMetrics() {
    const rect = els.frameViewport.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    let dpr = window.devicePixelRatio || 1;
    try {
      dpr = els.frame.contentWindow?.devicePixelRatio || dpr;
    } catch {}
    const scale = zoom / 100;
    return {
      rect,
      dpr,
      deviceW: rect.width * dpr,
      deviceH: rect.height * dpr,
      cssW: rect.width / scale,
      cssH: rect.height / scale,
    };
  }

  function updateSizeAvailability(metrics) {
    const realW = Math.max(1, Math.round(metrics.deviceW));
    const realH = Math.max(1, Math.round(metrics.deviceH));
    const shortMax = Math.min(realW, realH);
    const longMax = Math.max(realW, realH);

    for (const [select, max] of [[els.sizeShort, shortMax], [els.sizeLong, longMax]]) {
      for (const option of select.options) {
        if (option.value === 'auto' || option.value === COMPUTED_OPTION) continue;
        option.disabled = Number(option.value) > max;
      }
    }
    els.sizeWidth.max = String(realW);
    els.sizeHeight.max = String(realH);
    els.sizeWidth.title = `最大 ${realW}px（当前真实分辨率宽度）`;
    els.sizeHeight.title = `最大 ${realH}px（当前真实分辨率高度）`;

    if (sizeState.short !== 'auto' && Number(sizeState.short) > shortMax) sizeState.short = 'auto';
    if (sizeState.long !== 'auto' && Number(sizeState.long) > longMax) sizeState.long = 'auto';
    if (sizeState.width != null && sizeState.width > realW) sizeState.width = realW;
    if (sizeState.height != null && sizeState.height > realH) sizeState.height = realH;
  }

  function currentRatioParts() {
    const base = sizeState.ratio === 'auto' ? null : (SIZE_RATIOS[sizeState.ratio] || null);
    if (!base) return null;
    return sizeState.orientation === 'portrait' ? [base[1], base[0]] : base;
  }

  function ratioDisplayLabel() {
    const labels = RATIO_LABELS[sizeState.ratio];
    if (!labels) return sizeState.ratio;
    return labels[sizeState.orientation === 'portrait' ? 1 : 0];
  }

  function gcd(a, b) {
    while (b) {
      const next = a % b;
      a = b;
      b = next;
    }
    return a || 1;
  }

  function formatRatio(w, h) {
    const iw = Math.max(1, Math.round(w));
    const ih = Math.max(1, Math.round(h));
    const divisor = gcd(iw, ih);
    const rw = iw / divisor;
    const rh = ih / divisor;
    if (rw <= 100 && rh <= 100) return `${rw}:${rh}`;
    return `${(iw / ih).toFixed(2)}:1`;
  }

  function computeTargetSize(metrics) {
    const realW = Math.max(1, Math.round(metrics.deviceW));
    const realH = Math.max(1, Math.round(metrics.deviceH));
    const availW = Math.max(1, Math.floor(metrics.rect.width));
    const availH = Math.max(1, Math.floor(metrics.rect.height));
    const areaPortrait = availH >= availW;

    const manualW = sizeState.width != null ? Math.min(sizeState.width, realW) : null;
    const manualH = sizeState.height != null ? Math.min(sizeState.height, realH) : null;
    if (manualW != null || manualH != null) {
      return {
        w: manualW ?? availW,
        h: manualH ?? availH,
        mode: 'custom',
        limited: false,
      };
    }

    const shortMax = Math.min(realW, realH);
    const longMax = Math.max(realW, realH);
    let short = sizeState.short === 'auto' ? null : Math.min(Number(sizeState.short), shortMax);
    let long = sizeState.long === 'auto' ? null : Math.min(Number(sizeState.long), longMax);
    if (short != null && long != null && short > long) [short, long] = [long, short];

    if (short != null && long != null) {
      return areaPortrait
        ? { w: short, h: long, mode: 'edges', limited: false }
        : { w: long, h: short, mode: 'edges', limited: false };
    }

    const ratio = currentRatioParts();
    if (ratio) {
      const [rw, rh] = ratio;
      const ratioShort = Math.min(rw, rh);
      const ratioLong = Math.max(rw, rh);
      let w;
      let h;
      if (short != null) {
        long = short * (ratioLong / ratioShort);
        [w, h] = rw >= rh ? [long, short] : [short, long];
        return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)), mode: 'ratio-edge', limited: false };
      }
      if (long != null) {
        short = long * (ratioShort / ratioLong);
        [w, h] = rw >= rh ? [long, short] : [short, long];
        return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)), mode: 'ratio-edge', limited: false };
      }
      const fit = Math.min(availW / rw, availH / rh);
      return {
        w: Math.max(1, Math.floor(rw * fit)),
        h: Math.max(1, Math.floor(rh * fit)),
        mode: 'ratio',
        limited: false,
      };
    }

    if (short != null) {
      return areaPortrait
        ? { w: short, h: availH, mode: 'edge', limited: false }
        : { w: availW, h: short, mode: 'edge', limited: false };
    }
    if (long != null) {
      return areaPortrait
        ? { w: availW, h: long, mode: 'edge', limited: false }
        : { w: long, h: availH, mode: 'edge', limited: false };
    }
    return null;
  }

  function applyFrameLayout(metrics, target) {
    const zoomScale = zoom / 100;
    if (!target) {
      els.frameScaler.classList.remove('is-custom');
      els.frameScaler.style.width = `${metrics.rect.width / zoomScale}px`;
      els.frameScaler.style.height = `${metrics.rect.height / zoomScale}px`;
      els.frameScaler.style.transform = `scale(${zoomScale})`;
      return 1;
    }
    const fit = Math.min(1, metrics.rect.width / target.w, metrics.rect.height / target.h);
    els.frameScaler.classList.add('is-custom');
    els.frameScaler.style.width = `${target.w}px`;
    els.frameScaler.style.height = `${target.h}px`;
    els.frameScaler.style.transform = `translate(-50%, -50%) scale(${zoomScale * fit})`;
    return fit;
  }

  function updateFrameMetricsText(metrics) {
    const entry = activeIndex === null ? null : entries[activeIndex];
    if (!entry?.src || els.frame.hidden || !metrics) {
      els.metricDevice.textContent = '—';
      els.metricCss.textContent = '—';
      els.metricDpr.textContent = '—';
      return;
    }
    els.metricDevice.textContent = `${Math.round(metrics.deviceW)} × ${Math.round(metrics.deviceH)}`;
    els.metricCss.textContent = `${Math.round(metrics.cssW)} × ${Math.round(metrics.cssH)}`;
    els.metricDpr.textContent = String(parseFloat(metrics.dpr.toFixed(2)));
  }

  function updateFrameMetrics() {
    const metrics = viewportMetrics();
    if (!metrics) {
      els.metricDevice.textContent = '—';
      els.metricCss.textContent = '—';
      els.metricDpr.textContent = '—';
      return;
    }
    updateFrameMetricsText(metrics);
  }

  function initSizeControls() {
    for (const select of [els.sizeShort, els.sizeLong]) {
      for (const value of SIZE_PRESETS) {
        const option = document.createElement('option');
        option.value = String(value);
        option.textContent = String(value);
        select.append(option);
      }
    }
  }

  function clearComputedOption(select) {
    const option = select.querySelector(`option[value="${COMPUTED_OPTION}"]`);
    if (option) option.remove();
  }

  function renderSizer(target, fit) {
    const manual = sizeState.width != null || sizeState.height != null;
    const shortSet = sizeState.short !== 'auto';
    const longSet = sizeState.long !== 'auto';
    const bothEdges = !manual && shortSet && longSet;

    const portrait = sizeState.orientation === 'portrait';
    for (const option of els.sizeRatio.options) {
      const labels = RATIO_LABELS[option.value];
      if (labels) option.textContent = labels[portrait ? 1 : 0];
    }
    const orientLabel = portrait ? '纵向' : '横向';
    els.sizeOrient.textContent = orientLabel;
    els.sizeOrient.dataset.orientation = portrait ? 'portrait' : 'landscape';
    els.sizeOrient.title = `当前${orientLabel}，点击切换为${portrait ? '横向' : '纵向'}`;
    els.sizeOrient.setAttribute('aria-label', `比例方向：${orientLabel}，点击切换为${portrait ? '横向' : '纵向'}`);

    clearComputedOption(els.sizeShort);
    clearComputedOption(els.sizeLong);

    const ratioLocked = manual || bothEdges;
    els.sizeRatio.disabled = false;
    els.sizeRatio.value = ratioLocked ? 'actual' : sizeState.ratio;

    els.sizeShort.value = sizeState.short === 'auto' ? 'auto' : String(sizeState.short);
    els.sizeLong.value = sizeState.long === 'auto' ? 'auto' : String(sizeState.long);

    if (!manual && !bothEdges && sizeState.ratio !== 'auto' && target) {
      if (shortSet && !longSet) {
        const option = document.createElement('option');
        option.value = COMPUTED_OPTION;
        option.textContent = `${Math.round(Math.max(target.w, target.h))}（自动）`;
        els.sizeLong.append(option);
        els.sizeLong.value = COMPUTED_OPTION;
      } else if (!shortSet && longSet) {
        const option = document.createElement('option');
        option.value = COMPUTED_OPTION;
        option.textContent = `${Math.round(Math.min(target.w, target.h))}（自动）`;
        els.sizeShort.append(option);
        els.sizeShort.value = COMPUTED_OPTION;
      }
    }

    els.sizeWidth.value = sizeState.width == null ? '' : String(sizeState.width);
    els.sizeHeight.value = sizeState.height == null ? '' : String(sizeState.height);

    let text = '自适应';
    if (target) {
      const ratioText = !manual && !bothEdges && sizeState.ratio !== 'auto'
        ? ratioDisplayLabel()
        : formatRatio(target.w, target.h);
      text = `${Math.round(target.w)} × ${Math.round(target.h)} · ${ratioText}`;
      if (target.limited) text += ' · 已限制';
      if (fit < 0.995) text += ` · 适配 ${Math.round(fit * 100)}%`;
    }
    els.sizeReadout.textContent = text;
    els.sizeReadout.title = text;
  }

  function layoutFrame() {
    const metrics = viewportMetrics();
    if (!metrics) return;
    updateSizeAvailability(metrics);
    const target = computeTargetSize(metrics);
    const fit = applyFrameLayout(metrics, target);
    updateFrameMetricsText(metrics);
    renderSizer(target, fit);
  }

  let layoutScheduled = false;
  function scheduleLayout() {
    if (layoutScheduled) return;
    layoutScheduled = true;
    requestAnimationFrame(() => {
      layoutScheduled = false;
      layoutFrame();
    });
  }

  function persistZoom() {
    try { localStorage.setItem(ZOOM_STORAGE_KEY, String(zoomPercent())); } catch {}
  }

  function setZoom(next, { persist = false } = {}) {
    const clamped = clampZoom(next);
    if (clamped === zoom) {
      updateZoomReadout();
      if (persist) persistZoom();
      return;
    }
    zoom = clamped;
    updateZoomReadout();
    layoutFrame();
    if (persist) persistZoom();
  }

  function handleEdgeChange(which) {
    const select = which === 'short' ? els.sizeShort : els.sizeLong;
    if (select.value === COMPUTED_OPTION) {
      layoutFrame();
      return;
    }
    sizeState[which] = select.value === 'auto' ? 'auto' : Number(select.value);
    sizeState.width = null;
    sizeState.height = null;
    els.sizeWidth.value = '';
    els.sizeHeight.value = '';
    if (sizeState.short !== 'auto' && sizeState.long !== 'auto') {
      if (Number(sizeState.short) > Number(sizeState.long)) {
        [sizeState.short, sizeState.long] = [sizeState.long, sizeState.short];
      }
      sizeState.ratio = 'auto';
    }
    layoutFrame();
  }

  function handleManualSizeChange() {
    const metrics = viewportMetrics();
    const realW = metrics ? Math.max(1, Math.round(metrics.deviceW)) : Infinity;
    const realH = metrics ? Math.max(1, Math.round(metrics.deviceH)) : Infinity;
    const read = (value) => {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? Math.floor(number) : null;
    };
    let width = read(els.sizeWidth.value);
    let height = read(els.sizeHeight.value);
    if (width != null) width = Math.min(width, realW);
    if (height != null) height = Math.min(height, realH);

    sizeState.ratio = 'auto';
    sizeState.short = 'auto';
    sizeState.long = 'auto';
    sizeState.width = width;
    sizeState.height = height;
    els.sizeWidth.value = width == null ? '' : String(width);
    els.sizeHeight.value = height == null ? '' : String(height);
    layoutFrame();
  }

  els.sizeRatio.addEventListener('change', () => {
    const value = els.sizeRatio.value;
    if (value === 'actual') return;
    sizeState.width = null;
    sizeState.height = null;
    els.sizeWidth.value = '';
    els.sizeHeight.value = '';
    if (value !== 'auto' && sizeState.short !== 'auto' && sizeState.long !== 'auto') {
      sizeState.long = 'auto';
    }
    sizeState.ratio = value;
    layoutFrame();
  });
  els.sizeOrient.addEventListener('click', () => {
    sizeState.orientation = sizeState.orientation === 'portrait' ? 'landscape' : 'portrait';
    layoutFrame();
  });
  els.sizeShort.addEventListener('change', () => handleEdgeChange('short'));
  els.sizeLong.addEventListener('change', () => handleEdgeChange('long'));
  els.sizeWidth.addEventListener('change', handleManualSizeChange);
  els.sizeHeight.addEventListener('change', handleManualSizeChange);
  els.sizeReset.addEventListener('click', () => {
    sizeState.ratio = 'auto';
    sizeState.orientation = 'landscape';
    sizeState.short = 'auto';
    sizeState.long = 'auto';
    sizeState.width = null;
    sizeState.height = null;
    els.sizeWidth.value = '';
    els.sizeHeight.value = '';
    layoutFrame();
  });

  function showPlaceholder(title, text) {
    els.placeholderTitle.textContent = title;
    els.placeholderText.textContent = text;
    els.placeholder.hidden = false;
    els.frame.hidden = true;
    els.stageError.classList.remove('is-visible');
    els.mask.classList.remove('is-visible');
    setBarState(null);
    updateFrameMetrics();
  }

  function showStageError(message) {
    els.stageErrorText.textContent = message;
    els.stageError.classList.add('is-visible');
    els.placeholder.hidden = true;
    els.frame.hidden = true;
    els.mask.classList.remove('is-visible');
    setBarState('error');
    updateFrameMetrics();
  }

  function updateHash() {
    const next = activeIndex === null ? '' : `#/entry/${activeIndex}`;
    if (window.location.hash !== next) {
      history.replaceState(null, '', next || window.location.pathname + window.location.search);
    }
  }

  function selectEntry(index, { updateLocation = true } = {}) {
    const entry = entries[index];
    if (!entry) return;
    activeIndex = index;
    applyDocumentTitle(entry.title || entry.displayPath);

    for (const tab of els.tabs.children) {
      const isActive = Number(tab.dataset.index) === index;
      tab.classList.toggle('is-active', isActive);
      if (isActive && (!isDrawerLayout() || drawerOpen)) tab.scrollIntoView({ block: 'nearest' });
    }

    els.currentName.textContent = entry.title || entry.displayPath;
    els.currentSrc.textContent = entry.displayPath;
    els.currentSrc.title = entry.displayPath;

    if (updateLocation) updateHash();

    if (entry.error || !entry.src) {
      els.openRaw.setAttribute('aria-disabled', 'true');
      els.openRaw.href = '#';
      els.refreshFrame.setAttribute('aria-disabled', 'true');
      showStageError(entry.error || '该条目不可用');
      return;
    }

    els.openRaw.removeAttribute('aria-disabled');
    els.openRaw.href = entry.src;
    els.refreshFrame.removeAttribute('aria-disabled');

    setBarState(null);
    els.stageError.classList.remove('is-visible');
    els.placeholder.hidden = true;
    els.frame.hidden = false;
    els.mask.classList.add('is-visible');
    els.frame.src = entry.src;
    scheduleLayout();
  }

  function renderTabs() {
    els.tabs.replaceChildren();
    entries.forEach((entry, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab' + (entry.error ? ' is-error' : '');
      button.dataset.index = String(index);
      button.title = entry.error
        ? `${entry.displayPath}\n${entry.error}`
        : `${entry.title}\n${entry.displayPath}`;
      button.innerHTML = `
        <span class="tab__index">${String(index + 1).padStart(2, '0')}</span>
        <span class="tab__body">
          <span class="tab__title"></span>
          <span class="tab__path"></span>
        </span>
        <span class="tab__state"></span>`;
      button.querySelector('.tab__title').textContent = entry.title || entry.displayPath;
      button.querySelector('.tab__path').textContent = entry.displayPath;
      button.querySelector('.tab__state').textContent = entry.error ? '!' : '';
      button.addEventListener('click', () => {
        selectEntry(index);
        if (drawerOpen) setDrawerOpen(false);
      });
      els.tabs.append(button);
    });
  }

  function applyHashOnLoad() {
    const match = window.location.hash.match(/^#\/entry\/(\d+)$/);
    if (match && entries[Number(match[1])]) {
      selectEntry(Number(match[1]), { updateLocation: false });
    } else {
      const firstUsable = entries.findIndex((entry) => entry.src);
      if (firstUsable >= 0) selectEntry(firstUsable, { updateLocation: false });
    }
  }

  function toUrl(displayPath) {
    return displayPath.split('/').map((segment) => encodeURIComponent(segment)).join('/');
  }

  function baseName(displayPath) {
    return displayPath.replace(/\\/g, '/').split('/').filter(Boolean).pop() || displayPath;
  }

  function readTitle(text) {
    try {
      const doc = new DOMParser().parseFromString(text, 'text/html');
      return (doc.title || '').replace(/\s+/g, ' ').trim().slice(0, 120);
    } catch {
      return '';
    }
  }

  async function buildEntries() {
    const response = await fetch('config.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`config.json HTTP ${response.status}`);
    const data = await response.json();
    const items = Array.isArray(data) ? data : data?.entries;
    const rawTitle = Array.isArray(data) ? undefined : data?.title;
    if (!Array.isArray(items)) throw new Error('config.json 顶层应为数组，或包含 entries 数组');

    const built = await Promise.all(items.map(async (item, index) => {
      const spec = typeof item === 'string' ? { path: item } : (item || {});
      const displayPath = typeof spec.path === 'string' ? spec.path : '';
      const base = {
        index,
        displayPath,
        title: typeof spec.title === 'string' ? spec.title : '',
        src: null,
        error: null,
      };

      if (!displayPath.trim()) {
        return { ...base, error: '路径为空' };
      }
      if (/^(https?:)?\/\//i.test(displayPath.trim())) {
        return { ...base, title: base.title || displayPath, error: '暂不支持 URL，请填写本地文件路径' };
      }

      const src = toUrl(displayPath);
      try {
        const file = await fetch(src, { cache: 'no-store' });
        if (!file.ok) {
          return {
            ...base,
            title: base.title || baseName(displayPath),
            error: file.status === 403 ? '这是一个目录，请指向具体的 HTML 文件' : '文件不存在或无法访问',
          };
        }
        const detected = readTitle(await file.text());
        return { ...base, title: base.title || detected || baseName(displayPath), src };
      } catch {
        return { ...base, title: base.title || baseName(displayPath), error: '文件不存在或无法访问' };
      }
    }));

    return { entries: built, titleConfig: normalizeTitleConfig(rawTitle) };
  }

  async function load({ keepSelection = false } = {}) {
    const previousPath = keepSelection && activeIndex !== null ? entries[activeIndex]?.displayPath : null;
    els.reload.classList.add('spinning');
    try {
      const parsed = await buildEntries();
      entries = parsed.entries;
      titleConfig = parsed.titleConfig;
      renderTabs();
      const usable = entries.filter((entry) => entry.src).length;
      setCount(entries.length
        ? `${entries.length} 个条目 · ${usable} 个可用`
        : '列表为空');

      if (previousPath) {
        const index = entries.findIndex((entry) => entry.displayPath === previousPath);
        if (index >= 0) {
          selectEntry(index, { updateLocation: false });
          return;
        }
      }
      activeIndex = null;
      applyHashOnLoad();
      if (activeIndex === null) applyDocumentTitle();
    } catch (error) {
      entries = [];
      titleConfig = normalizeTitleConfig();
      applyDocumentTitle();
      els.tabs.replaceChildren();
      setCount('读取失败');
      const item = document.createElement('div');
      item.className = 'placeholder';
      item.style.height = 'auto';
      item.style.padding = '24px 16px';
      item.innerHTML = '<p class="err"></p>';
      item.querySelector('.err').textContent = `读取 config.json 失败：${error.message}`;
      els.tabs.append(item);
      showPlaceholder('列表不可用', `无法读取配置：${error.message}`);
    } finally {
      els.reload.classList.remove('spinning');
    }
  }

  els.reload.addEventListener('click', () => load({ keepSelection: true }));
  els.menuToggle.addEventListener('click', () => setDrawerOpen(!drawerOpen));
  els.drawerClose.addEventListener('click', () => setDrawerOpen(false));
  els.drawerScrim.addEventListener('click', () => setDrawerOpen(false));
  DRAWER_MEDIA.addEventListener('change', () => {
    if (!DRAWER_MEDIA.matches) setDrawerOpen(false, { restoreFocus: false });
  });

  els.refreshFrame.addEventListener('click', () => {
    if (activeIndex === null) return;
    const entry = entries[activeIndex];
    if (!entry?.src) return;
    els.mask.classList.add('is-visible');
    els.frame.src = entry.src;
  });

  els.frame.addEventListener('load', () => {
    els.mask.classList.remove('is-visible');
    if (!els.frame.hidden) setBarState('ok');
    scheduleLayout();
    try {
      els.frame.contentWindow?.addEventListener('resize', scheduleLayout);
    } catch {}
  });

  let persistTimer = null;
  els.zoomRange.addEventListener('input', () => {
    setZoom(Number(els.zoomRange.value));
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persistZoom, 200);
  });
  els.zoomRange.addEventListener('change', () => {
    clearTimeout(persistTimer);
    setZoom(Number(els.zoomRange.value), { persist: true });
  });
  els.zoomOut.addEventListener('click', () => setZoom(zoom - ZOOM_STEP, { persist: true }));
  els.zoomIn.addEventListener('click', () => setZoom(zoom + ZOOM_STEP, { persist: true }));
  els.zoomReset.addEventListener('click', () => setZoom(100, { persist: true }));

  if ('ResizeObserver' in window) {
    new ResizeObserver(scheduleLayout).observe(els.frameViewport);
  } else {
    window.addEventListener('resize', scheduleLayout);
  }
  window.addEventListener('orientationchange', scheduleLayout);

  window.addEventListener('hashchange', () => {
    const match = window.location.hash.match(/^#\/entry\/(\d+)$/);
    if (match && entries[Number(match[1])] && Number(match[1]) !== activeIndex) {
      selectEntry(Number(match[1]), { updateLocation: false });
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && drawerOpen) {
      event.preventDefault();
      setDrawerOpen(false);
      return;
    }
    if (event.target instanceof HTMLElement && /^(INPUT|TEXTAREA)$/.test(event.target.tagName)) return;
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    if (!entries.length) return;
    event.preventDefault();
    const direction = event.key === 'ArrowDown' ? 1 : -1;
    let next = activeIndex === null ? 0 : activeIndex + direction;
    while (next >= 0 && next < entries.length && !entries[next].src) next += direction;
    if (next >= 0 && next < entries.length) selectEntry(next);
  });

  initSizeControls();
  updateZoomReadout();
  layoutFrame();
  applyDocumentTitle();
  load();
})();
</script>
</body>
</html>
