<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOIR · 光标轨迹</title>
<style>
  :root{
    --ink: #F2EFE8;
    --muted: #9A9489;
    --faint: #6B665E;
    --line: rgba(255,255,255,.14);
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: #060608;
    color: var(--ink);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }
  .page{ position: relative; height: 100vh; min-height: 520px; overflow: hidden; }
  .shader{ position: absolute; inset: 0; width: 100%; height: 100%; }
  .veil{
    position: absolute; inset: 0;
    background:
      radial-gradient(90% 70% at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.28) 62%, rgba(0,0,0,.72) 100%),
      linear-gradient(0deg, rgba(6,6,8,.68), rgba(6,6,8,0) 36%);
    pointer-events: none;
  }
  .content{
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column;
    padding: 26px clamp(22px, 4vw, 60px) 24px;
    pointer-events: none;
  }
  .nav{ display: flex; align-items: center; gap: 26px; }
  .brand{ font: 700 13px var(--mono); letter-spacing: .24em; }
  .nav nav{ display: flex; gap: 20px; margin-left: 14px; }
  .nav a{
    color: var(--muted); font-size: 11.5px; text-decoration: none;
    letter-spacing: .06em;
    pointer-events: auto;
  }
  .nav a:hover{ color: var(--ink); }
  .nav .counter{
    margin-left: auto;
    font: 10px var(--mono);
    color: var(--faint);
    letter-spacing: .12em;
  }
  .headline{
    margin-top: auto;
    margin-bottom: auto;
    display: flex; flex-direction: column;
    gap: 2px;
    user-select: none;
  }
  h1{
    font-size: clamp(64px, 14vw, 190px);
    line-height: .82;
    letter-spacing: -.06em;
    font-weight: 700;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,.62);
  }
  h1 .solid{ color: var(--ink); -webkit-text-stroke: 0; }
  .sub{
    align-self: flex-end;
    margin-top: 18px;
    max-width: 420px;
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--muted);
    text-align: right;
  }
  .bottom{
    margin-top: auto;
    display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .palette{ display: flex; align-items: center; gap: 9px; }
  .swatch{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
  }
  .palette span{
    font: 10px var(--mono);
    color: var(--faint);
    letter-spacing: .1em;
  }
  .hint{
    margin-left: auto;
    font: 10px var(--mono);
    color: var(--faint);
    letter-spacing: .1em;
    line-height: 1.7;
    text-align: right;
  }
  .hint b{ color: var(--ink); font-weight: 400; }
  .gpu-warning{
    margin-top: 16px;
    max-width: 460px;
    padding: 8px 12px;
    border-left: 2px solid #E3A04A;
    background: rgba(0,0,0,.28);
    font-size: 11.5px;
    line-height: 1.7;
    color: #D8C7AB;
    pointer-events: none;
  }
  @media (max-width: 760px){
    .nav nav{ display: none; }
    .sub{ text-align: left; align-self: flex-start; }
    .hint{ display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react-runtime.js"></script>
  <script>
    const { React, createRoot, htm, Shaders } = window.HSPV_REACT;
    const { Shader, LinearGradient, MeshGradient, CursorTrail, FloatingParticles, FilmGrain } = Shaders;
    const html = htm.bind(React.createElement);

    const PALETTES = [
      { name: "EMBER", a: "#FF4D4D", b: "#FFB86B", dust: "#FFD9B0" },
      { name: "ICE", a: "#6EE7FF", b: "#8B7CFF", dust: "#CFE8FF" },
      { name: "ACID", a: "#D8FF4F", b: "#22EE88", dust: "#EFFFB8" },
    ];

    function App(){
      const [index, setIndex] = React.useState(0);
      const [gpuError, setGpuError] = React.useState('');
      const palette = PALETTES[index];

      function cycle(event){
        if (event.target.closest('a, button')) return;
        setIndex((index + 1) % PALETTES.length);
      }

      return html`<div class="page" onClick=${cycle}>
        <${Shader}
          className="shader"
          disableTelemetry=${true}
          onUnavailable=${setGpuError}
        >
          <${LinearGradient} colorA="#050508" colorB="#180D16" angle=${135} />
          <${MeshGradient}
            colorA="#07070C"
            colorB="#26101A"
            count=${4}
            smoothness=${2.6}
            variation=${0.5}
            swirl=${0.18}
            drift=${0.35}
          />
          <${CursorTrail}
            colorA=${palette.a}
            colorB=${palette.b}
            radius=${0.9}
            length=${1.2}
            shrink=${1}
            softness=${0.35}
          />
          <${FloatingParticles}
            count=${520}
            speed=${0.06}
            particleSize=${0.7}
            randomness=${0.4}
            twinkle=${0.5}
          />
          <${FilmGrain} strength=${0.16} animated=${true} />
        <//>
        <div class="veil"></div>

        <div class="content">
          <header class="nav">
            <div class="brand">NOIR</div>
            <nav>
              <a href="#">作品</a>
              <a href="#">工作室</a>
              <a href="#">联系</a>
            </nav>
            <span class="counter">PALETTE 0${index + 1} / 03</span>
          </header>

          <div class="headline">
            <h1>NOIR<span class="solid">.</span></h1>
            <p class="sub">黑暗不是空的。移动光标，让经过的地方留下温度；点击任意位置，换一组光的颜色。</p>
            ${gpuError ? html`<div class="gpu-warning">当前浏览器未启用 WebGPU（${gpuError || 'unknown'}），光标轨迹效果无法显示。若通过局域网 IP 的 http:// 打开，浏览器会禁用 WebGPU；请改用 localhost / 127.0.0.1 或 HTTPS。</div>` : null}
          </div>

          <footer class="bottom">
            <div class="palette">
              <span style=${{ background: `linear-gradient(135deg, ${palette.a}, ${palette.b})` }} class="swatch"></span>
              <span>${palette.name}</span>
              <span style=${{ background: palette.dust }} class="swatch"></span>
            </div>
            <div class="hint">
              <b>MOVE</b> TO PAINT<br />
              <b>CLICK</b> TO CHANGE LIGHT
            </div>
          </footer>
        </div>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
