<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURORA FORGE · 极光渐变工坊</title>
<style>
  :root{
    --bg: #05070E;
    --panel: #0A0E18;
    --panel-2: #101725;
    --line: #1B2637;
    --text: #EAF1FA;
    --muted: #8795A9;
    --faint: #5A687C;
    --mint: #7DFFD1;
    --lilac: #C9A6FF;
    --mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .shell{ display: grid; grid-template-columns: minmax(0, 1fr) 404px; height: 100vh; min-height: 620px; }

  .preview{
    position: relative;
    min-width: 0;
    overflow: hidden;
    background:
      radial-gradient(80% 110% at 18% 8%, rgba(65, 235, 190, .20), transparent 58%),
      radial-gradient(70% 100% at 78% 24%, rgba(170, 108, 255, .24), transparent 62%),
      radial-gradient(90% 100% at 52% 100%, rgba(255, 92, 178, .13), transparent 60%),
      linear-gradient(158deg, #071124 0%, #02040A 62%, #0C0719 100%);
  }
  .preview::before{
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(140, 220, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 220, 255, .045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(80% 80% at 50% 50%, #000 20%, transparent 100%);
    pointer-events: none;
  }
  .preview::after{
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(3, 6, 13, .74), rgba(3, 6, 13, 0) 42%),
      radial-gradient(120% 100% at 50% 50%, transparent 42%, rgba(2, 4, 10, .42) 100%);
    pointer-events: none;
  }
  .shader{ position: absolute; inset: 0; width: 100%; height: 100%; }

  .preview__head{
    position: absolute; top: 22px; left: 26px; right: 26px; z-index: 2;
    display: flex; align-items: center; gap: 14px;
  }
  .preview__brand{ font: 700 12px var(--mono); letter-spacing: .2em; }
  .preview__brand b{ color: var(--mint); font-weight: 700; }
  .live{
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px;
    border: 1px solid rgba(125, 255, 209, .32);
    border-radius: 999px;
    color: var(--mint);
    font: 9.5px var(--mono); letter-spacing: .14em;
  }
  .live i{ width: 5px; height: 5px; border-radius: 50%; background: var(--mint); animation: blink 1.8s infinite; }
  @keyframes blink{ 50%{ opacity: .2; } }
  .preview__tag{ margin-left: auto; font: 10px var(--mono); color: var(--faint); letter-spacing: .08em; }

  .preview__hero{
    position: absolute; left: 26px; bottom: 34px; z-index: 2;
    max-width: 600px;
  }
  .eyebrow{
    display: flex; align-items: center; gap: 11px;
    font: 10px var(--mono); letter-spacing: .2em; color: var(--mint);
  }
  .eyebrow::before{ content: ""; width: 26px; height: 1px; background: var(--mint); }
  .preview__hero h1{
    margin: 18px 0 14px;
    font-size: clamp(34px, 4.7vw, 60px);
    line-height: 1.08;
    letter-spacing: -.035em;
    font-weight: 650;
  }
  .preview__hero h1 em{
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1px rgba(234, 241, 250, .7);
  }
  .preview__hero p{
    max-width: 430px;
    color: #B6C3D3;
    font-size: 13px;
    line-height: 1.85;
  }
  .preview__hint{ margin-top: 18px; font: 10px var(--mono); color: var(--faint); letter-spacing: .1em; }

  .stack{
    position: absolute; right: 26px; top: 50%; z-index: 2;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 16px;
    text-align: right;
    font: 9.5px var(--mono); letter-spacing: .16em;
    color: var(--faint);
  }
  .stack div{ display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .stack i{ width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .stack .on{ color: var(--text); }
  .stack .on i{ background: var(--mint); box-shadow: 0 0 10px var(--mint); }
  .stack .aurora.on i{ background: var(--lilac); box-shadow: 0 0 10px var(--lilac); }

  .gpu-warning{
    position: absolute; left: 26px; top: 64px; z-index: 3;
    max-width: 450px;
    padding: 8px 12px;
    border-left: 2px solid #E3A04A;
    background: rgba(0, 0, 0, .34);
    color: #D8C7AB;
    font-size: 11.5px;
    line-height: 1.7;
  }

  .panel{
    display: flex; flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
  }
  .panel__head{
    display: flex; align-items: baseline; gap: 10px;
    padding: 21px 22px 15px;
    border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 600;
  }
  .panel__head span{ margin-left: auto; font: 10px var(--mono); color: var(--faint); letter-spacing: .1em; }
  .panel__body{ padding: 16px 22px 22px; }
  .section{ margin-bottom: 19px; }
  .section__label{
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 9px;
    font: 9.5px var(--mono); letter-spacing: .14em; color: var(--faint);
  }
  .section__label b{ font-weight: 500; letter-spacing: 0; color: var(--mint); }
  .section__label .mesh{ color: var(--mint); }
  .section__label .aurora{ color: var(--lilac); }

  .presets{ display: flex; gap: 6px; flex-wrap: wrap; }
  .preset{
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font: inherit; font-size: 11px;
    cursor: pointer;
    transition: .15s;
  }
  .preset:hover{ border-color: #37465B; color: var(--text); }
  .preset.on{ border-color: var(--mint); color: var(--mint); background: rgba(125, 255, 209, .07); }

  .layers{ display: flex; flex-direction: column; gap: 7px; }
  .layer{
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .layer i{ width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .layer .mesh-dot{ background: var(--mint); box-shadow: 0 0 8px rgba(125, 255, 209, .7); }
  .layer .aurora-dot{ background: var(--lilac); box-shadow: 0 0 8px rgba(201, 166, 255, .7); }
  .layer span{ font-size: 12px; color: #C6D1DF; }
  .layer em{ font-style: normal; margin-left: 6px; font: 9.5px var(--mono); color: var(--faint); letter-spacing: .08em; }
  .layer input{ margin-left: auto; width: 15px; height: 15px; accent-color: var(--mint); }

  .colors{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .colors.two{ grid-template-columns: repeat(2, 1fr); }
  .color{ display: flex; flex-direction: column; gap: 5px; font-size: 9.5px; color: var(--faint); }
  .color input{
    width: 100%; height: 32px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
  }
  .control{ display: block; margin-bottom: 13px; }
  .control:last-child{ margin-bottom: 0; }
  .control .row{ display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 11.5px; color: #C6D0DD; }
  .control .row b{ font: 10.5px var(--mono); font-weight: 500; color: var(--mint); }
  .aurora-control .row b{ color: var(--lilac); }
  input[type="range"]{ width: 100%; height: 4px; appearance: none; background: #1D293A; border-radius: 2px; outline: none; }
  input[type="range"]::-webkit-slider-thumb{
    appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--mint); border: 2px solid var(--panel); cursor: pointer;
  }
  .aurora-control input[type="range"]::-webkit-slider-thumb{ background: var(--lilac); }

  .segments{ display: flex; gap: 5px; }
  .segment{
    flex: 1;
    padding: 6px 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: 10.5px var(--mono);
    cursor: pointer;
  }
  .segment.on{ border-color: var(--lilac); color: var(--lilac); background: rgba(201, 166, 255, .07); }

  .toggle{ display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #C6D0DD; cursor: pointer; user-select: none; }
  .toggle input{ width: 15px; height: 15px; accent-color: var(--mint); }

  .actions{ display: flex; gap: 8px; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); }
  .btn{
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit; font-size: 11.5px;
    cursor: pointer;
    transition: .15s;
  }
  .btn:hover{ border-color: var(--mint); color: var(--mint); }
  .btn.primary{ border-color: var(--mint); background: var(--mint); color: #06110D; font-weight: 600; }
  .btn.primary:hover{ filter: brightness(1.06); color: #06110D; }

  .code{
    margin-top: 12px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #060A11;
    color: #8FA0B4;
    font: 9.5px/1.75 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .code b{ color: var(--mint); font-weight: 500; }
  .code i{ color: var(--lilac); font-style: normal; }

  .panel__foot{
    margin-top: auto;
    padding: 13px 22px 18px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    line-height: 1.7;
    color: var(--faint);
  }

  @media (max-width: 900px){
    body{ overflow: auto; }
    .shell{ display: block; height: auto; }
    .preview{ height: 62vh; min-height: 420px; }
    .panel{ border-left: 0; border-top: 1px solid var(--line); }
    .stack{ display: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="./vendor/react-runtime.js"></script>
  <script>
    const { React, createRoot, htm, Shaders } = window.HSPV_REACT;
    const { Shader, LinearGradient, MeshGradient, Aurora, FilmGrain } = Shaders;
    const html = htm.bind(React.createElement);
    const { useState } = React;

    const PRESETS = [
      {
        name: "极夜森林",
        aurora: ["#A533F8", "#22EE88", "#1694E8"],
        mesh: ["#040A1E", "#0B2C4A"],
        intensity: 82, speed: 5, waviness: 62, curtains: 4,
        count: 5, smoothness: 2.2, swirl: 0.35, drift: 0.5,
      },
      {
        name: "玫瑰电离",
        aurora: ["#FF5E7A", "#FFD166", "#6C5CE7"],
        mesh: ["#160A26", "#4A1745"],
        intensity: 70, speed: 3.5, waviness: 82, curtains: 3,
        count: 6, smoothness: 2.8, swirl: -0.45, drift: 0.62,
      },
      {
        name: "薄荷深空",
        aurora: ["#38F2C4", "#6EE7FF", "#7C6CFF"],
        mesh: ["#031014", "#0B3B42"],
        intensity: 90, speed: 7, waviness: 48, curtains: 4,
        count: 4, smoothness: 2.0, swirl: 0.55, drift: 0.42,
      },
      {
        name: "日落电路",
        aurora: ["#FF8A4C", "#FF4D8D", "#8B5CF6"],
        mesh: ["#1A0C12", "#3A1530"],
        intensity: 74, speed: 4, waviness: 70, curtains: 2,
        count: 7, smoothness: 1.7, swirl: 0.25, drift: 0.7,
      },
    ];

    function clamp(value, min, max){ return Math.min(max, Math.max(min, value)); }

    function Slider({ label, en, value, min, max, step, onChange, aurora }){
      return html`<label class=${'control' + (aurora ? ' aurora-control' : '')}>
        <span class="row"><span>${label} <em style=${{ fontStyle: 'normal', color: 'var(--faint)' }}>${en}</em></span><b>${value}</b></span>
        <input
          type="range"
          min=${min} max=${max} step=${step}
          value=${value}
          onInput=${(event) => onChange(Number(event.target.value))}
        />
      </label>`;
    }

    function App(){
      const first = PRESETS[0];
      const [presetIndex, setPresetIndex] = useState(0);
      const [auroraColors, setAuroraColors] = useState([...first.aurora]);
      const [meshColors, setMeshColors] = useState([...first.mesh]);
      const [intensity, setIntensity] = useState(first.intensity);
      const [auroraSpeed, setAuroraSpeed] = useState(first.speed);
      const [waviness, setWaviness] = useState(first.waviness);
      const [curtains, setCurtains] = useState(first.curtains);
      const [count, setCount] = useState(first.count);
      const [smoothness, setSmoothness] = useState(first.smoothness);
      const [swirl, setSwirl] = useState(first.swirl);
      const [drift, setDrift] = useState(first.drift);
      const [meshOn, setMeshOn] = useState(true);
      const [auroraOn, setAuroraOn] = useState(true);
      const [grain, setGrain] = useState(true);
      const [gpuError, setGpuError] = useState('');
      const [copied, setCopied] = useState(false);

      function applyPreset(index){
        const preset = PRESETS[index];
        setPresetIndex(index);
        setAuroraColors([...preset.aurora]);
        setMeshColors([...preset.mesh]);
        setIntensity(preset.intensity);
        setAuroraSpeed(preset.speed);
        setWaviness(preset.waviness);
        setCurtains(preset.curtains);
        setCount(preset.count);
        setSmoothness(preset.smoothness);
        setSwirl(preset.swirl);
        setDrift(preset.drift);
      }

      function updateAuroraColor(index, value){
        setAuroraColors((prev) => prev.map((color, i) => i === index ? value : color));
        setPresetIndex(-1);
      }

      function updateMeshColor(index, value){
        setMeshColors((prev) => prev.map((color, i) => i === index ? value : color));
        setPresetIndex(-1);
      }

      const code = `<MeshGradient colorA="${meshColors[0]}" colorB="${meshColors[1]}"\n  count={${count}} smoothness={${smoothness.toFixed(1)}} swirl={${swirl.toFixed(2)}} />\n<Aurora colorA="${auroraColors[0]}" colorB="${auroraColors[1]}" colorC="${auroraColors[2]}"\n  intensity={${intensity}} speed={${auroraSpeed}} waviness={${waviness}}\n  curtainCount={${curtains}} />`;

      async function copyCode(){
        try {
          await navigator.clipboard.writeText(code);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        } catch {
          setCopied(false);
        }
      }

      return html`<div class="shell">
        <section class="preview">
          <${Shader} className="shader" disableTelemetry=${true} onUnavailable=${setGpuError}>
            <${LinearGradient} colorA="#02040C" colorB="#081228" angle=${105} />
            ${meshOn ? html`<${MeshGradient}
              colorA=${meshColors[0]}
              colorB=${meshColors[1]}
              count=${clamp(count, 2, 8)}
              smoothness=${smoothness}
              variation=${0.38}
              swirl=${swirl}
              drift=${drift}
              speed=${0.9}
            />` : null}
            ${auroraOn ? html`<${Aurora}
              colorA=${auroraColors[0]}
              colorB=${auroraColors[1]}
              colorC=${auroraColors[2]}
              intensity=${intensity}
              speed=${auroraSpeed}
              waviness=${waviness}
              curtainCount=${curtains}
              rayDensity=${22}
              blendMode="screen"
              opacity=${0.94}
            />` : null}
            ${grain ? html`<${FilmGrain} strength=${0.18} animated=${true} />` : null}
          <//>

          <div class="preview__head">
            <span class="preview__brand">AURORA <b>/</b> FORGE</span>
            <span class="live"><i></i> LIVE COMPOSITE</span>
            <span class="preview__tag">React 19 × shaders</span>
          </div>

          ${gpuError ? html`<div class="gpu-warning">当前浏览器未启用 WebGPU（${gpuError || 'unknown'}），双层光效无法实时渲染。若通过局域网 IP 的 http:// 打开，浏览器会禁用 WebGPU；请改用 localhost / 127.0.0.1 或 HTTPS。</div>` : null}

          <div class="stack">
            <div class=${'aurora' + (auroraOn ? ' on' : '')}><span>01 AURORA</span><i></i></div>
            <div class=${meshOn ? 'on' : ''}><span>02 MESH</span><i></i></div>
            <div class=${grain ? 'on' : ''}><span>03 GRAIN</span><i></i></div>
          </div>

          <div class="preview__hero">
            <div class="eyebrow">DUAL-LAYER LIGHT ENGINE</div>
            <h1>两层光，<br />共用一张<em>画布</em>。</h1>
            <p>流动的极光与网格渐变的体积感叠在同一张 WebGPU 画布上。切换图层、拧动参数，实时合成属于你的光。</p>
            <div class="preview__hint">MESH GRADIENT + AURORA · 60 FPS TARGET · WEBGPU</div>
          </div>
        </section>

        <aside class="panel">
          <div class="panel__head">合成控制台 <span>LIVE COMPOSITE</span></div>
          <div class="panel__body">
            <div class="section">
              <div class="section__label"><span>场景</span><span>SCENE</span></div>
              <div class="presets">
                ${PRESETS.map((preset, index) => html`
                  <button type="button" class=${'preset' + (presetIndex === index ? ' on' : '')} onClick=${() => applyPreset(index)}>${preset.name}</button>
                `)}
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>图层</span><span>LAYERS</span></div>
              <div class="layers">
                <label class="layer">
                  <i class="aurora-dot"></i>
                  <span>极光层 <em>AURORA</em></span>
                  <input type="checkbox" checked=${auroraOn} onChange=${(event) => setAuroraOn(event.target.checked)} />
                </label>
                <label class="layer">
                  <i class="mesh-dot"></i>
                  <span>渐变层 <em>MESH</em></span>
                  <input type="checkbox" checked=${meshOn} onChange=${(event) => setMeshOn(event.target.checked)} />
                </label>
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>渐变层颜色</span><b class="mesh">MESH</b></div>
              <div class="colors two">
                ${["底色 A", "底色 B"].map((label, index) => html`
                  <label class="color">
                    <span>${label}</span>
                    <input type="color" value=${meshColors[index]} onChange=${(event) => updateMeshColor(index, event.target.value)} />
                  </label>
                `)}
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>渐变参数</span><span>PROPS</span></div>
              <${Slider} label="色点数量" en="count" value=${count} min="2" max="8" step="1" onChange=${setCount} />
              <${Slider} label="柔和度" en="smoothness" value=${smoothness} min="0.5" max="5" step="0.1" onChange=${setSmoothness} />
              <${Slider} label="旋涡" en="swirl" value=${swirl} min="-1" max="1" step="0.01" onChange=${setSwirl} />
              <${Slider} label="漂移" en="drift" value=${drift} min="0" max="1" step="0.01" onChange=${setDrift} />
            </div>

            <div class="section">
              <div class="section__label"><span>极光层颜色</span><b class="aurora">AURORA</b></div>
              <div class="colors">
                ${["边缘", "核心", "光梢"].map((label, index) => html`
                  <label class="color">
                    <span>${label}</span>
                    <input type="color" value=${auroraColors[index]} onChange=${(event) => updateAuroraColor(index, event.target.value)} />
                  </label>
                `)}
              </div>
            </div>

            <div class="section">
              <div class="section__label"><span>极光参数</span><span>PROPS</span></div>
              <${Slider} label="亮度" en="intensity" value=${intensity} min="10" max="100" step="1" onChange=${setIntensity} aurora=${true} />
              <${Slider} label="速度" en="speed" value=${auroraSpeed} min="-10" max="10" step="1" onChange=${setAuroraSpeed} aurora=${true} />
              <${Slider} label="波动" en="waviness" value=${waviness} min="0" max="200" step="1" onChange=${setWaviness} aurora=${true} />
              <div class="control aurora-control">
                <span class="row"><span>光幕层数 <em style=${{ fontStyle: 'normal', color: 'var(--faint)' }}>curtainCount</em></span><b>${curtains}</b></span>
                <div class="segments">
                  ${[1, 2, 3, 4].map((n) => html`
                    <button type="button" class=${'segment' + (curtains === n ? ' on' : '')} onClick=${() => setCurtains(n)}>${n}</button>
                  `)}
                </div>
              </div>
            </div>

            <div class="section">
              <label class="toggle">
                <input type="checkbox" checked=${grain} onChange=${(event) => setGrain(event.target.checked)} />
                叠加胶片颗粒
              </label>
            </div>

            <div class="actions">
              <button class="btn" type="button" onClick=${() => applyPreset(Math.floor(Math.random() * PRESETS.length))}>随机场景</button>
              <button class="btn primary" type="button" onClick=${copyCode}>${copied ? '已复制' : '复制配方'}</button>
            </div>

            <div class="code">${code}</div>
          </div>
          <div class="panel__foot">
            所有控件都由 React state 直接写入 shader uniform；极光层以 screen 模式叠加在渐变层之上。<br />
            WebGPU 不可用时，页面会显示降级提示。
          </div>
        </aside>
      </div>`;
    }

    createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
