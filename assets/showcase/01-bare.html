<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裸页面 · 默认样式</title>
</head>
<body>
<h1>裸页面</h1>
<p>这是一个完全没有样式的 HTML 单页。它使用浏览器的默认字体、默认颜色和默认间距，用来观察最原始的内容呈现。</p>
<p>有时候，<strong>少即是多</strong>；有时候，只是懒得写 CSS。</p>
<ul>
  <li>默认的标题层级</li>
  <li>默认的段落间距</li>
  <li>默认的链接颜色</li>
</ul>
<blockquote>“内容先于形式。”</blockquote>
<p><a href="#">一个默认样式的链接</a></p>
</body>
</html>
